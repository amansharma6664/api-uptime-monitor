spring.application.name=uptime-monitor
# Cloud (Render/Railway) PORT env deta hai, local par 8080
server.port=${PORT:8080}

# ---------- MySQL ----------
# Local: root/root @ localhost:3306 (database khud ban jata hai).
# Cloud: DB_URL (poora JDBC url) ya DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD set karo.
# Railway ke MYSQLHOST/MYSQLPORT/MYSQLUSER/MYSQLPASSWORD/MYSQLDATABASE bhi apne aap padh liye jate hain.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:uptime_monitor}}?${DB_PARAMS:createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}

# Tables automatically create / update ho jati hain (database/schema.sql sirf optional manual option hai)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# Production me JWT_SECRET env zaroor set karo (kam se kam 32 characters)
app.jwt.secret=${JWT_SECRET:uptime-monitor-super-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---------- Monitoring ----------
app.monitor.worker-threads=10
app.monitor.retention-days=30
app.monitor.failure-threshold=2

# ---------- CORS ----------
# *.vercel.app aur *.netlify.app code me already allowed hain. Custom domain ho to CORS_ORIGINS me daalo (comma separated).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Email alerts (optional) ----------
app.alert.email.enabled=${ALERT_EMAIL_ENABLED:false}
app.alert.email.from=${ALERT_EMAIL_FROM:alerts@uptime-monitor.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.aman.uptime=INFO
